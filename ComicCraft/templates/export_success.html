{% extends "base.html" %}


{% block title %}
Export Complete • ComicCraft
{% endblock %}


{% block content %}


<section class="success-card">


    <div class="success-icon">
        ✓
    </div>


    <h1>
        Comic exported successfully!
    </h1>


    <p>

        Your PDF is ready.

        {% if filename %}

        File:

        <strong>
            {{ filename }}
        </strong>

        {% endif %}

    </p>


    <a
        class="primary-btn"
        href="/"
    >
        Go Create Another Comic
    </a>


</section>


{% endblock %}
